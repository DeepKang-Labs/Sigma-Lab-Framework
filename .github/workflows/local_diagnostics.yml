name: Local diagnostics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pytest -q -rs
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt -r requirements-ui.txt
      - run: python -m pytest ui_tests -q
